[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kitchen-proto = { path = "crates/kitchen-proto" }
kitchen-symbols = { path = "crates/kitchen-symbols" }
kitchen-core = { path = "crates/kitchen-core" }

[profile.release]
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2
