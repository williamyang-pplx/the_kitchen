[package]
name = "kitchenctl"
version.workspace = true
edition.workspace = true
description = "Command-line control of the kitchen, for agents and humans"

[[bin]]
name = "kitchenctl"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
kitchen-proto.workspace = true
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions", "wrap_help"] }

[dev-dependencies]
tempfile = "3"
