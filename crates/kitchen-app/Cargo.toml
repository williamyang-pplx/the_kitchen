[package]
name = "kitchen-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "kitchen-app"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui = "0.36"
alacritty_terminal = "0.26"
png = "0.18"
kitchen-core.workspace = true
kitchen-proto.workspace = true
log = "0.4"
env_logger = "0.11"
kitchen-symbols.workspace = true
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
tree-sitter-highlight = "0.25"
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
similar = "2"
regex = "1"
winit = "0.30"
mlua = { version = "0.12", features = ["lua54", "vendored", "serialize"] }
toml = "0.9"
egui_commonmark = { version = "0.25", default-features = false, features = ["pulldown_cmark"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDictionary", "NSError", "NSObject", "NSSet", "NSBundle", "NSData"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSEvent", "NSPasteboard", "NSImageRep", "NSBitmapImageRep"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger"] }
block2 = "0.6"
