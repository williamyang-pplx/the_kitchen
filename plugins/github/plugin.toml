name = "github"
version = "0.1.0"
description = "Review a GitHub PR in the current tab: paste its link into ⌘⇧P to see its diff and review comments; ⌘M posts to the PR; ⌘⇧S switches between the tab's PRs; ⌘⇧D shows the PR's description"
api = 12

[config]
# Where gh lives when the kitchen was started from Finder (minimal PATH).
path = "/opt/homebrew/bin:/usr/local/bin:$HOME/.local/bin"
