name = "github"
version = "0.1.0"
description = "Open GitHub PR links (⌘E / kitchenctl tab open) as tabs on the PR's branch showing its diff; ⌘M posts review comments to the PR and shows its threads"
api = 7

[config]
# Where gh lives when the kitchen was started from Finder (minimal PATH).
path = "/opt/homebrew/bin:/usr/local/bin:$HOME/.local/bin"
