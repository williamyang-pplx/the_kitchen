name = "github"
version = "0.1.0"
description = "Review a GitHub PR in the current tab: paste its link into ⌘⇧P to see its diff and review comments; ⌘M posts to the PR; ⌘⇧S switches between the tab's PRs (a check on approved ones); the viewer's file list shows the PR's reviewers (a team's members on hover) and the checks blocking its merge; ⌘⇧D shows the PR's description; ⌘⇧O opens it in Chrome"
api = 12

[config]
# Where gh lives when the kitchen was started from Finder (minimal PATH).
path = "/opt/homebrew/bin:/usr/local/bin:$HOME/.local/bin"
# The commit status (ppl-ai/agi's) that says whether a PR's code owners
# approved it, for the check on approved PRs in ⌘⇧S. A PR without it falls
# back to GitHub's review decision; "" stops asking for it.
owners_status = "[Blocking] Ownership Requirements"
