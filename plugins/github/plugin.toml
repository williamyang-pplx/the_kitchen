name = "github"
version = "0.1.0"
description = "Open GitHub PR links (⌘T / kitchenctl tab open) as tabs on the PR's branch showing its diff; in any tab on a PR's branch, ⌘M posts review comments to the PR and shows its threads, and \\p diffs against the PR's base"
api = 8

[config]
# Where gh lives when the kitchen was started from Finder (minimal PATH).
path = "/opt/homebrew/bin:/usr/local/bin:$HOME/.local/bin"
