<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f4a"/>
      <stop offset="1" stop-color="#16161e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.42" cy="0.46" r="0.5">
      <stop offset="0" stop-color="#b26bff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#b26bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b7089"/>
      <stop offset="1" stop-color="#2b2e3d"/>
    </linearGradient>
    <radialGradient id="surface" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#3a3e52"/>
      <stop offset="1" stop-color="#15161f"/>
    </radialGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5a3c"/>
      <stop offset="1" stop-color="#4a2d1c"/>
    </linearGradient>
    <radialGradient id="yolk" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#f5a623"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- macOS icon tile (824px body inside the 1024 canvas) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>

  <g filter="url(#shadow)">
    <!-- handle, toward the lower right -->
    <g transform="rotate(40 440 480)">
      <rect x="690" y="452" width="80" height="56" rx="10" fill="#3b3f52"/>
      <rect x="755" y="438" width="250" height="84" rx="42" fill="url(#handle)"/>
      <circle cx="965" cy="480" r="15" fill="#2a1a10"/>
    </g>
    <!-- pan -->
    <circle cx="440" cy="480" r="260" fill="url(#rim)"/>
    <circle cx="440" cy="480" r="222" fill="url(#surface)"/>
  </g>

  <!-- fried egg -->
  <path d="M330 470 C 310 390, 400 340, 460 370 C 530 340, 580 420, 555 480
           C 590 550, 520 610, 450 590 C 380 620, 300 560, 330 470 Z" fill="#f4f1ea"/>
  <circle cx="448" cy="478" r="62" fill="url(#yolk)"/>
  <ellipse cx="428" cy="456" rx="18" ry="11" fill="#fff6d5" opacity="0.85"/>

  <!-- steam -->
  <g fill="none" stroke="#c9a6ff" stroke-width="22" stroke-linecap="round" opacity="0.9">
    <path d="M370 250 C 340 215, 400 190, 370 150"/>
    <path d="M450 235 C 420 195, 480 170, 450 125"/>
    <path d="M530 250 C 500 215, 560 190, 530 150"/>
  </g>
</svg>
